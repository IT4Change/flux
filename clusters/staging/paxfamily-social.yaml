# paxfamily.social, staging: the deployment's own manifests in its repo (flux/staging/).
#
# Over SSH with a deploy key that may write: Flux commits the image tag it rolls out back to the
# repo (flux/staging/images.yaml, ImageUpdateAutomation). The key is on the repo as a deploy key
# with write access, its private half in paxfamily-social-deploy-key.sops.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: paxfamily-social
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/IT4Change/paxfamily.social
  ref:
    branch: master
  secretRef:
    name: paxfamily-social-deploy-key
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paxfamily-social-staging
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: paxfamily-social
  path: ./flux/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
