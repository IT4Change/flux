# paxfamily.social, staging: the deployment's own manifests in its repo (flux/staging/).
#
# Read only, over HTTPS, without credentials: the repo is public. Flux writes nothing back — the
# repo's own workflow commits the image tag it built (publish.yml, roll-out-staging).
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: paxfamily-social
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/IT4Change/paxfamily.social
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paxfamily-social-staging
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: paxfamily-social
  path: ./flux/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
