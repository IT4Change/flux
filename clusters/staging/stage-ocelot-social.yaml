# stage.ocelot.social: the deployment's own manifests in its repo (flux/staging/).
#
# Read only, over HTTPS, without credentials: the repo is public. Flux writes nothing back — the
# repo's own workflow commits the image tag it built (publish.yml, roll-out-staging), started by
# every push to its master and by ocelot.social's docker-push for each commit of the release branch.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: stage-ocelot-social
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Ocelot-Social-Community/stage.ocelot.social
  ref:
    branch: master
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: stage-ocelot-social-staging
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: stage-ocelot-social
  path: ./flux/staging
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
