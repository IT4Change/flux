---
environments:
  default:
    values:
      - ./environments/default.yaml.gotmpl
    secrets:
      - ./environments/default.secrets.yaml
  production:
    values:
      - ./environments/production.yaml.gotmpl
    secrets:
      - ./environments/production.secrets.yaml
---
repositories:
  - name: fluxcd-community
    url: https://fluxcd-community.github.io/helm-charts

releases:
  - name: flux
    namespace: flux-system
    createNamespace: true
    chart: fluxcd-community/flux2
    # Pinned: a chart upgrade changes the controllers and their CRDs, so it is a deliberate step,
    # not something the next `apply` picks up on its own.
    version: 2.20.0
    values:
    - ./values/flux.yaml.gotmpl
