---
environments:
  default:
    values:
      - ./environments/default.yaml.gotmpl
    secrets:
      - ./environments/default.secrets.yaml
  production:
    values:
      - ./environments/production.yaml.gotmpl
    secrets:
      - ./environments/production.secrets.yaml
---
repositories:
  - name: fluxcd-community
    url: https://fluxcd-community.github.io/helm-charts

releases:
  - name: flux
    namespace: flux-system
    createNamespace: true
    chart: fluxcd-community/flux2
    # Pinned: a chart upgrade changes the controllers and their CRDs, so it is a deliberate step,
    # not something the next `apply` picks up on its own.
    version: 2.20.0
    values:
    - ./values/flux.yaml.gotmpl

  # What Flux follows (clusters/<cluster>/ of this repo) and the issuer of its webhook ingress. A
  # release of its own, after the controllers: its objects are kinds the first release brings, and
  # helm cannot install an object whose CRD it is installing in the same release.
  - name: flux-sync
    namespace: flux-system
    chart: ./charts/flux-sync
    needs:
      - flux-system/flux
    values:
    - ./values/flux-sync.yaml.gotmpl
